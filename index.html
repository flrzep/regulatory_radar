<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulatory Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- P3 CI tokens ---- */
  --p3-blue:#2323FF;
  --p3-blue-bright:#4646FF;
  --p3-blue-deep:#0D0D8C;
  --p3-navy:#070733;

  --bg:#04041A;
  --bg-2:#08082B;
  --surface:#0C0C33;
  --surface-2:#12124A;
  --line:rgba(255,255,255,.12);
  --line-soft:rgba(255,255,255,.06);
  --txt:#FFFFFF;
  --txt-dim:#A9AEDC;
  --txt-mute:#6F76AE;

  /* categories */
  --cat-consumer:#FF6A2B;
  --cat-industrial:#8B8BFF;

  /* rings */
  --ring-1:rgba(70,70,255,.26);
  --ring-2:rgba(70,70,255,.15);
  --ring-3:rgba(70,70,255,.07);

  --radius:14px;
  --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    radial-gradient(1200px 600px at 15% -10%, rgba(35,35,255,.30), transparent 60%),
    radial-gradient(900px 500px at 95% 5%, rgba(13,13,140,.45), transparent 62%);
  background-attachment:fixed;
}
a{color:var(--p3-blue-bright);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1260px;margin:0 auto;padding:0 24px}

/* ================= HEADER ================= */
header{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(14px);
  background:rgba(4,4,26,.72);
  border-bottom:1px solid var(--line-soft);
}
.hdr{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.logo .mark{
  font-weight:800;font-size:26px;letter-spacing:-1px;line-height:1;
  color:#fff;border-left:3px solid #fff;padding-left:6px;
}
.logo .div{width:1px;height:24px;background:var(--line)}
.logo .name{font-size:12px;letter-spacing:2.4px;font-weight:600;color:var(--txt-dim);text-transform:uppercase}
.hdr .spacer{flex:1}
.hdr .ver{font-size:11px;letter-spacing:1.6px;color:var(--txt-mute);text-transform:uppercase}

/* ================= HERO ================= */
.hero{padding:44px 0 22px}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.eyebrow .bar{width:64px;height:1px;background:rgba(255,255,255,.5)}
.eyebrow span{font-size:11px;letter-spacing:2.6px;font-weight:600;text-transform:uppercase;color:#fff}
h1{
  font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-1.5px;
  margin:0 0 14px;line-height:1.02;text-transform:uppercase;
}
h1 em{font-style:normal;color:var(--p3-blue-bright)}
.lede{max-width:720px;color:var(--txt-dim);font-size:16px;line-height:1.65;margin:0}

/* ================= CONTROLS ================= */
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:30px 0 8px}
.seg{
  display:inline-flex;padding:4px;gap:4px;
  border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);
}
.seg button{
  font-family:var(--font);font-size:12.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--txt-dim);background:transparent;border:0;cursor:pointer;
  padding:10px 20px;border-radius:999px;transition:.18s;white-space:nowrap;
}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:var(--p3-blue);color:#fff;box-shadow:0 6px 22px rgba(35,35,255,.45)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.chip{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  font-size:11.5px;font-weight:600;letter-spacing:.6px;color:var(--txt-dim);
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:transparent;
  font-family:var(--font);transition:.18s;
}
.chip:hover{border-color:rgba(255,255,255,.3);color:#fff}
.chip[aria-pressed="false"]{opacity:.35}
.chip .swatch{width:10px;height:10px;border-radius:50%}
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewtog button{
  font-family:var(--font);background:transparent;border:0;color:var(--txt-dim);cursor:pointer;
  padding:9px 14px;font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
}
.viewtog button[aria-pressed="true"]{background:rgba(255,255,255,.08);color:#fff}

/* ================= RADAR ================= */
.panel{
  margin:22px 0 40px;border:1px solid var(--line-soft);border-radius:var(--radius);
  background:linear-gradient(180deg, rgba(12,12,51,.78), rgba(4,4,26,.5));
  padding:26px 26px 18px;position:relative;overflow:hidden;
}
.panel::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 340px at 50% 118%, rgba(35,35,255,.22), transparent 70%);
}
.radar{position:relative;width:100%;aspect-ratio:2.15/1;min-height:340px}
.rings{position:absolute;inset:0;overflow:hidden}
.ring{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  aspect-ratio:1;border-radius:50%;
}
.ring.r3{width:80%;background:var(--ring-3);border:1.5px solid rgba(90,90,255,.85)}
.ring.r2{width:54.4%;background:var(--ring-2);border:1.5px solid rgba(120,120,255,.7)}
.ring.r1{width:33.6%;background:var(--ring-1);border:1.5px solid rgba(110,110,255,.60)}
.axis-v{position:absolute;left:50%;bottom:0;width:1px;height:94%;background:rgba(255,255,255,.22)}
.axis-h{position:absolute;left:10%;right:10%;bottom:0;height:1px;background:rgba(255,255,255,.14)}
.half-label{
  position:absolute;font-size:clamp(13px,1.45vw,20px);font-weight:700;letter-spacing:.5px;
  color:rgba(255,255,255,.62);white-space:nowrap;pointer-events:none;
}
.half-label.left{left:17%;top:20%;transform:rotate(-38deg)}
.half-label.right{right:17%;top:20%;transform:rotate(38deg)}

.blips{position:absolute;inset:0}
.blip{
  position:absolute;left:var(--x);top:calc(var(--y) + var(--dy,0px));
  display:flex;align-items:center;gap:6px;
  background:none;border:0;padding:0;cursor:pointer;font-family:var(--font);
  transition:filter .18s, opacity .2s;
}
.blip.left{transform:translate(calc(-100% + 44px),-50%)}
.blip.right{transform:translate(-44px,-50%)}
.blip .lbl{
  background:var(--surface-2);color:#fff;border:1px solid rgba(255,255,255,.18);
  border-radius:8px;padding:7px 11px;font-size:11.5px;font-weight:600;line-height:1.25;
  max-width:190px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.45);
  transition:.18s;
}
.blip.right .lbl{text-align:left}
.blip .dot{
  width:16px;height:16px;border-radius:50%;flex:0 0 16px;
  box-shadow:0 0 0 3px rgba(4,4,26,.9), 0 0 14px 1px currentColor;
  background:currentColor;transition:.18s;
}
.blip[data-cat="consumer"] .dot{color:var(--cat-consumer)}
.blip[data-cat="industrial"] .dot{color:var(--cat-industrial)}
.blip:hover .lbl{background:var(--p3-blue);border-color:var(--p3-blue-bright);transform:translateY(-1px)}
.blip:hover .dot{transform:scale(1.18)}
.blip:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:10px}
.blip.dimmed{opacity:.16;pointer-events:none;filter:grayscale(1)}

.flag{
  width:30px;height:20px;border-radius:4px;flex:0 0 30px;
  display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.3px;
  border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative;
}
.flag.EU{background:#003399;color:#FFCC00}
.flag.US{background:repeating-linear-gradient(180deg,#B22234 0 3px,#fff 3px 6px);color:#fff}
.flag.US::after{content:"";position:absolute;left:0;top:0;width:14px;height:11px;background:#3C3B6E}
.flag.US span{position:relative;z-index:2;text-shadow:0 0 3px #000}
.flag.INT{background:var(--p3-blue-deep);color:#fff;font-size:12px}

/* maturity axis */
.mat-axis{display:flex;align-items:center;gap:0;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.mat-axis .steps{display:flex;align-items:center;gap:0;flex:1;min-width:280px}
.mat-step{
  position:relative;padding:4px 18px 4px 0;font-size:10.5px;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-mute);
}
.mat-step::after{content:"";position:absolute;right:6px;top:50%;width:1px;height:14px;background:var(--line);transform:translateY(-50%)}
.mat-step.on{color:#fff}
.mat-arrow{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);position:relative;min-width:40px}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--txt-dim)}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .sw{width:11px;height:11px;border-radius:50%}

/* ================= LIST VIEW ================= */
.listview{display:none}
.listview.on{display:block}
.radarview.off{display:none}
.lgroup h3{
  font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--txt-mute);
  margin:24px 0 12px;font-weight:700;
}
.lgroup:first-child h3{margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{
  text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line-soft);
  border-radius:12px;padding:16px;cursor:pointer;font-family:var(--font);color:#fff;
  transition:.18s;display:flex;flex-direction:column;gap:10px;
}
.card:hover{background:rgba(35,35,255,.14);border-color:var(--p3-blue)}
.card.dimmed{display:none}
.card .top{display:flex;align-items:center;gap:9px}
.card .nm{font-size:13.5px;font-weight:700;line-height:1.3}
.card .tg{font-size:11.5px;color:var(--txt-dim);line-height:1.5}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;
  padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--txt-dim)}
.tag.published{border-color:rgba(70,255,150,.4);color:#5BE59A}
.tag.final{border-color:rgba(255,190,60,.4);color:#FFC24A}
.tag.draft{border-color:rgba(255,106,43,.45);color:var(--cat-consumer)}

/* ================= MODAL ================= */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(2,2,14,.78);backdrop-filter:blur(8px);
  padding:24px;overflow-y:auto;
}
.overlay.on{display:flex;align-items:flex-start;justify-content:center}
.modal{
  width:min(720px,100%);margin:auto;background:linear-gradient(180deg,var(--surface),#07071F);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.7);animation:pop .22s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal .mhead{padding:26px 28px 20px;border-bottom:1px solid var(--line-soft);position:relative;
  background:linear-gradient(135deg,rgba(35,35,255,.30),transparent 65%)}
.modal .mhead .row{display:flex;align-items:flex-start;gap:14px}
.modal h2{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.25;padding-right:36px}
.modal .full{font-size:12.5px;color:var(--txt-dim);line-height:1.55}
.modal .mmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.close{
  position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;
  font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;font-family:var(--font);
}
.close:hover{background:var(--p3-blue)}
.mbody{padding:24px 28px 28px;display:flex;flex-direction:column;gap:22px}
.sec h4{
  margin:0 0 9px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--p3-blue-bright);font-weight:700;
}
.sec p{margin:0;font-size:13.5px;line-height:1.7;color:#D9DCF5}
.sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.sec li{font-size:13px;line-height:1.62;color:#D9DCF5}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px}
.kv dt{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-mute);font-weight:700;padding-top:2px}
.kv dd{margin:0;font-size:13px;color:#D9DCF5;line-height:1.55}
.p3take{border-left:2px solid var(--p3-blue);background:rgba(35,35,255,.10);padding:14px 16px;border-radius:0 10px 10px 0}
.p3take h4{color:#fff}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{
  font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;color:var(--txt-dim);text-decoration:none;transition:.18s;
}
.links a:hover{border-color:var(--p3-blue);color:#fff;background:rgba(35,35,255,.16);text-decoration:none}

footer{border-top:1px solid var(--line-soft);margin-top:40px;padding:22px 0 40px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--txt-mute);letter-spacing:.4px}

@media (max-width:860px){
  .radar{aspect-ratio:1.35/1}
  .blip .lbl{font-size:10px;max-width:120px;padding:5px 8px}
  .flag{width:22px;height:15px;flex:0 0 22px;font-size:7px}
  .blip .dot{width:12px;height:12px;flex:0 0 12px}
  .blip.left{transform:translate(calc(-100% + 34px),-50%)}
  .blip.right{transform:translate(-34px,-50%)}
  .filters{margin-left:0}
  .kv{grid-template-columns:1fr}
  .half-label.left{left:6%;top:14%}
  .half-label.right{right:6%;top:14%}
}
</style>
</head>
<body>

<header>
  <div class="wrap hdr">
    <div class="logo">
      <div class="mark">P3</div>
      <div class="div"></div>
      <div class="name">Regulatory Radar</div>
    </div>
    <div class="spacer"></div>
    <div class="ver">Demo &middot; Q3 2026</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow"><span class="bar"></span><span id="domainEyebrow">Robotics</span></div>
    <h1>Standards &amp; <em>Regulation</em> Landscape</h1>
    <p class="lede" id="lede"></p>
  </section>

  <div class="controls">
    <div class="seg" role="group" aria-label="Domain">
      <button data-domain="robotics" aria-pressed="true">Robotics</button>
      <button data-domain="ad" aria-pressed="false">Autonomous Driving</button>
    </div>
    <div class="filters">
      <button class="chip" data-filter="consumer" aria-pressed="true"><span class="swatch" style="background:var(--cat-consumer)"></span>Consumer / Service</button>
      <button class="chip" data-filter="industrial" aria-pressed="true"><span class="swatch" style="background:var(--cat-industrial)"></span>Industrial</button>
      <div class="viewtog" role="group" aria-label="View">
        <button data-view="radar" aria-pressed="true">Radar</button>
        <button data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="radarview" id="radarView">
      <div class="radar" id="radar">
        <div class="rings">
          <div class="ring r3"></div>
          <div class="ring r2"></div>
          <div class="ring r1"></div>
          <div class="axis-v"></div>
          <div class="axis-h"></div>
        </div>
        <div class="half-label left">Cybersecurity</div>
        <div class="half-label right">Functional Safety</div>
        <div class="blips" id="blips"></div>
      </div>
      <div class="mat-axis">
        <div class="steps">
          <span class="mat-step">Draft</span>
          <span class="mat-step">Finalization</span>
          <span class="mat-step on">Published</span>
          <span class="mat-arrow"></span>
        </div>
        <div class="legend">
          <div class="li"><span class="sw" style="background:var(--cat-consumer)"></span>Consumer / Service</div>
          <div class="li"><span class="sw" style="background:var(--cat-industrial)"></span>Industrial</div>
          <div class="li"><span class="sw" style="background:var(--p3-blue-deep);border:1px solid var(--line)"></span>International</div>
        </div>
      </div>
    </div>
    <div class="listview" id="listView"></div>
  </div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modal"></div>
</div>

<footer>
  <div class="wrap foot">
    <div>P3 &mdash; Technology Consultancy &middot; Regulatory Radar (demo)</div>
    <div>Illustrative content &middot; not legal advice</div>
  </div>
</footer>

<script>
/* =========================================================
   DATA
   axis: 'cyber' (left half) | 'safety' (right half)
   ring: 'draft' | 'final' | 'published'  (outer -> inner)
   cat : 'consumer' | 'industrial'
   a   : angle in degrees (0 = right baseline, 180 = left baseline)
   r   : radius fraction 0..1 of the outer dome
   ========================================================= */
const DATA = {
  robotics: {
    label: "Robotics",
    lede: "Where the safety and cybersecurity rulebook for industrial, mobile and service robotics stands today — from published ISO/IEC baselines at the core to draft instruments still forming at the edge. Select any item for scope, status and what it means for product teams.",
    items: [
      /* ---------- CYBERSECURITY (left) ---------- */
      {
        id:"cra", name:"Cyber Resilience Act", full:"Regulation (EU) 2024/2847 on horizontal cybersecurity requirements for products with digital elements",
        axis:"cyber", ring:"draft", cat:"industrial", region:"EU", a:176, rr:0.45,
        tagline:"Horizontal EU cybersecurity law that pulls every connected robot into CE marking scope.",
        meta:{Status:"In force, obligations phasing in", Applies:"Main obligations from 11 Dec 2027; vulnerability reporting from 11 Sep 2026", Body:"European Commission / ENISA", Scope:"All products with digital elements placed on the EU market"},
        what:"The CRA is the first horizontal cybersecurity regulation covering any product with digital elements — hardware, firmware and standalone software. For robotics it sits on top of the Machinery Regulation: a robot arm, an AMR or a teach pendant app all fall in scope, and non-compliance blocks the CE mark.",
        req:[
          "Security-by-design and by-default: no known exploitable vulnerabilities at release, secure default configuration, attack-surface minimisation.",
          "Coordinated vulnerability disclosure policy and an SBOM maintained in a machine-readable format.",
          "Free security updates for the defined support period (minimum 5 years for most robotics products).",
          "Report actively exploited vulnerabilities and severe incidents to ENISA / the national CSIRT within 24h (early warning) and 72h (full notification).",
          "Conformity assessment route depends on whether the product is classed as default, Important (Class I/II) or Critical."
        ],
        take:"Most robotics OEMs underestimate the operational side: a PSIRT, a vulnerability intake channel and a build pipeline that emits a maintained SBOM are multi-quarter programmes, not documentation exercises. Harmonised standards are still being drafted, so early movers should map onto IEC 62443-4-1 / -4-2 as a proxy.",
        links:[{l:"EUR-Lex 2024/2847",u:"https://eur-lex.europa.eu/eli/reg/2024/2847/oj"}]
      },
      {
        id:"red", name:"RED · ETSI EN 303 645", full:"Radio Equipment Directive Delegated Regulation (EU) 2022/30 · EN 18031 series · ETSI EN 303 645",
        axis:"cyber", ring:"final", cat:"consumer", region:"EU", a:161, rr:0.60,
        tagline:"Baseline cybersecurity for any radio-connected robot sold in the EU.",
        meta:{Status:"Applicable", Applies:"Since 1 August 2025", Body:"European Commission · CEN/CENELEC · ETSI", Scope:"Radio equipment: Wi-Fi / BLE / cellular-connected robots"},
        what:"The RED delegated act activates Articles 3(3)(d), (e) and (f) of the Radio Equipment Directive — network protection, personal data protection and protection from fraud. The EN 18031 series provides the harmonised presumption of conformity; ETSI EN 303 645 remains the widely used consumer-IoT baseline behind it.",
        req:[
          "No universal default passwords — unique per-device credentials or forced change at commissioning.",
          "Secure, authenticated software update mechanism with signed images.",
          "Protection of personal and traffic data; minimise exposed network interfaces.",
          "Network resilience: the device must not harm the network or other devices under fault or attack.",
          "Documented means of reporting vulnerabilities."
        ],
        take:"For service and consumer robotics this is the nearest and cheapest win: EN 18031 assessment is well understood by notified bodies, and the controls overlap ~70% with what the CRA will demand in 2027. Do it once, reuse the evidence.",
        links:[{l:"Delegated Reg. 2022/30",u:"https://eur-lex.europa.eu/eli/reg_del/2022/30/oj"},{l:"ETSI EN 303 645",u:"https://www.etsi.org/standards"}]
      },
      {
        id:"iec62443", name:"IEC 62443 Certification", full:"IEC 62443 series — Security for industrial automation and control systems",
        axis:"cyber", ring:"published", cat:"industrial", region:"INT", a:146, rr:0.96,
        tagline:"The de-facto certification scheme for industrial robot controllers and cells.",
        meta:{Status:"Published (multi-part, actively maintained)", Applies:"Now — increasingly contractual", Body:"IEC TC65 / ISA99", Scope:"IACS products, systems and the organisations that build them"},
        what:"IEC 62443 is a family rather than a single standard. For robotics the load-bearing parts are 62443-4-1 (secure product development lifecycle), 62443-4-2 (technical security requirements for components, with Security Levels SL 1–4) and 62443-3-3 (system-level requirements for the integrated cell).",
        req:[

const RING_LABEL = { draft:"Draft", final:"Finalization", published:"Published" };
const CAT_LABEL  = { consumer:"Consumer / Service", industrial:"Industrial" };
const REGION_LABEL = { EU:"European Union", US:"United States", INT:"International" };
const FLAG_TXT = { EU:"EU", US:"US", INT:"\u{1F310}" };

/* ---------------- STATE ---------------- */
const NARROW = 760;
let state = { domain:"robotics", view: window.innerWidth < NARROW ? "list" : "radar", cats:new Set(["consumer","industrial"]) };

const $  = (s,c=document)=>c.querySelector(s);
const $$ = (s,c=document)=>[...c.querySelectorAll(s)];

function flagEl(region){
  const inner = region==="US" ? '<span>US</span>' : FLAG_TXT[region];
  return '<span class="flag '+region+'" title="'+REGION_LABEL[region]+'">'+inner+'</span>';
}

/* ---------------- RADAR ---------------- */
const ASPECT = 2.15;                       // must match .radar aspect-ratio
const BAND = { published:[0.10,0.40], final:[0.46,0.64], draft:[0.70,0.94] };

/* radius is derived from the ring so a blip can never be plotted
   in a band that contradicts its published/finalization/draft status.
   `rr` (0..1) only picks the position *within* that band. */
function radiusOf(item){
  const [lo,hi] = BAND[item.ring];
  return lo + (hi-lo) * (item.rr ?? 0.5);
}
function pos(item){
  const rad = item.a * Math.PI/180;
  const r = radiusOf(item);
  const x = 50 + 40 * r * Math.cos(rad);            // dome radius = 40% of width
  const y = 100 - 40 * ASPECT * r * Math.sin(rad);
  return { x, y };
}

function renderRadar(){
  const items = DATA[state.domain].items;
  const host = $("#blips");
  host.innerHTML = items.map(it=>{
    const p = pos(it);
    const side = it.axis === "cyber" ? "left" : "right";
    const lbl  = '<span class="lbl">'+it.name+'</span>';
    const dot  = '<span class="dot"></span>';
    const flg  = flagEl(it.region);
    const inner = side==="left" ? lbl+dot+flg : flg+dot+lbl;
    return '<button class="blip '+side+'" data-id="'+it.id+'" data-cat="'+it.cat+'" '+
           'style="--x:'+p.x.toFixed(2)+'%;--y:'+p.y.toFixed(2)+'%" '+
           'title="'+it.name+' — '+RING_LABEL[it.ring]+'">'+inner+'</button>';
  }).join("");
  requestAnimationFrame(deoverlap);
}

/* nudge labels vertically so chips never collide */
function deoverlap(){
  const host = $("#blips");
  const nodes = $$(".blip", host).filter(n=>!n.classList.contains("dimmed"));
  nodes.forEach(n=>n.style.setProperty("--dy","0px"));
  const H = host.getBoundingClientRect().height;
  if(!H) return;
  const box = n => { const r=n.getBoundingClientRect(); return {n,l:r.left,r:r.right,t:r.top,b:r.bottom}; };
  const hb = host.getBoundingClientRect();
  for(let pass=0; pass<16; pass++){
    let moved = false;
    const bs = nodes.map(box).sort((a,b)=>a.t-b.t);
    for(let i=0;i<bs.length;i++){
      for(let j=i+1;j<bs.length;j++){
        const A=bs[i], B=bs[j];
        const ox = Math.min(A.r,B.r) - Math.max(A.l,B.l);
        const oy = Math.min(A.b,B.b) - Math.max(A.t,B.t);
        if(ox > -4 && oy > -3){
          const push = (oy + 6) / 2;
          shift(A.n, -push); shift(B.n, push);
          A.t-=push; A.b-=push; B.t+=push; B.b+=push;
          moved = true;
        }
      }
    }
    // keep every chip inside the radar box (the baseline row would otherwise
    // spill onto the maturity axis below)
    for(const b of bs){
      let d = 0;
      if(b.b > hb.bottom) d = hb.bottom - b.b;
      else if(b.t < hb.top) d = hb.top - b.t;
      if(d){ shift(b.n, d); b.t+=d; b.b+=d; moved = true; }
    }
    if(!moved) break;
  }
}
function shift(el, dy){
  const cur = parseFloat(el.style.getPropertyValue("--dy")) || 0;
  el.style.setProperty("--dy", (cur+dy).toFixed(1)+"px");
}

/* ---------------- LIST ---------------- */
function renderList(){
  const items = DATA[state.domain].items;
  const groups = [["cyber","Cybersecurity"],["safety","Functional Safety"]];
  $("#listView").innerHTML = groups.map(([ax,title])=>{
    const rows = items.filter(i=>i.axis===ax)
      .sort((a,b)=>["draft","final","published"].indexOf(a.ring)-["draft","final","published"].indexOf(b.ring))
      .map(it=>
        '<button class="card" data-id="'+it.id+'" data-cat="'+it.cat+'">'+
          '<div class="top">'+flagEl(it.region)+'<span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--cat-'+it.cat+')"></span>'+
          '<span class="nm">'+it.name+'</span></div>'+
          '<div class="tg">'+it.tagline+'</div>'+
          '<div class="meta"><span class="tag '+it.ring+'">'+RING_LABEL[it.ring]+'</span>'+
          '<span class="tag">'+REGION_LABEL[it.region]+'</span></div>'+
        '</button>').join("");
    return '<div class="lgroup"><h3>'+title+'</h3><div class="cards">'+rows+'</div></div>';
  }).join("");
}

/* ---------------- MODAL ---------------- */
let lastFocus = null;
function openModal(id){
  const it = DATA[state.domain].items.find(x=>x.id===id);
  if(!it) return;
  lastFocus = document.activeElement;
  $("#modal").innerHTML =
    '<div class="mhead">'+
      '<button class="close" id="closeBtn" aria-label="Close">&times;</button>'+
      '<div class="row">'+flagEl(it.region)+
        '<div><h2 id="mTitle">'+it.name+'</h2><div class="full">'+it.full+'</div></div>'+
      '</div>'+
      '<div class="mmeta">'+
        '<span class="tag '+it.ring+'">'+RING_LABEL[it.ring]+'</span>'+
        '<span class="tag">'+CAT_LABEL[it.cat]+'</span>'+
        '<span class="tag">'+(it.axis==="cyber"?"Cybersecurity":"Functional Safety")+'</span>'+
        '<span class="tag">'+DATA[state.domain].label+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="mbody">'+
      '<div class="sec"><h4>What it is</h4><p>'+it.what+'</p></div>'+
      '<div class="sec"><h4>At a glance</h4><dl class="kv">'+
        Object.entries(it.meta).map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join("")+
      '</dl></div>'+
      '<div class="sec"><h4>Key requirements</h4><ul>'+it.req.map(r=>'<li>'+r+'</li>').join("")+'</ul></div>'+
      '<div class="sec p3take"><h4>P3 perspective</h4><p>'+it.take+'</p></div>'+
      '<div class="sec"><h4>Reference</h4><div class="links">'+
        it.links.map(l=>'<a href="'+l.u+'" target="_blank" rel="noopener">'+l.l+' ↗</a>').join("")+
      '</div></div>'+
    '</div>';
  $("#overlay").classList.add("on");
  document.body.style.overflow="hidden";
  $("#closeBtn").focus();
}
function closeModal(){
  $("#overlay").classList.remove("on");
  document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}

/* ---------------- FILTERS / RENDER ---------------- */
function applyFilters(){
  $$(".blip").forEach(b=> b.classList.toggle("dimmed", !state.cats.has(b.dataset.cat)) );
  $$(".card").forEach(c=> c.classList.toggle("dimmed", !state.cats.has(c.dataset.cat)) );
  requestAnimationFrame(deoverlap);
}
function render(){
  $("#domainEyebrow").textContent = DATA[state.domain].label;
  $("#lede").textContent = DATA[state.domain].lede;
  renderRadar();
  renderList();
  applyFilters();
  $("#radarView").classList.toggle("off", state.view!=="radar");
  $("#listView").classList.toggle("on", state.view==="list");
  $$(".viewtog button").forEach(x=> x.setAttribute("aria-pressed", String(x.dataset.view===state.view)));
}

/* ---------------- EVENTS ---------------- */
$$(".seg button").forEach(b=> b.addEventListener("click", ()=>{
  state.domain = b.dataset.domain;
  $$(".seg button").forEach(x=> x.setAttribute("aria-pressed", String(x===b)));
  render();
}));
$$(".viewtog button").forEach(b=> b.addEventListener("click", ()=>{
  state.view = b.dataset.view;
  $$(".viewtog button").forEach(x=> x.setAttribute("aria-pressed", String(x===b)));
  render();
}));
$$(".chip").forEach(b=> b.addEventListener("click", ()=>{
  const c = b.dataset.filter;
  if(state.cats.has(c) && state.cats.size>1) state.cats.delete(c); else state.cats.add(c);
  b.setAttribute("aria-pressed", String(state.cats.has(c)));
  applyFilters();
}));
document.addEventListener("click", e=>{
  const t = e.target.closest(".blip, .card");
  if(t) openModal(t.dataset.id);
});
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
document.addEventListener("click", e=>{ if(e.target.id==="closeBtn") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#overlay").classList.contains("on")) closeModal(); });
window.addEventListener("resize", ()=>requestAnimationFrame(deoverlap));

render();
</script>
</body>
</html>
